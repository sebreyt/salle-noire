<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 940" width="780" height="940" role="img" aria-labelledby="t dd" font-family="system-ui, sans-serif" font-size="14">
<title id="t">Le poids d’un rayon</title>
<desc id="dd">Tirer un rayon, c’est choisir un point de la source et un point de l’ouverture visée ; l’ensemble des choix a une étendue G, le flux qui le traverse vaut L·G et chaque rayon en porte L·G/N. Sur le banc, l’étendue tirée vaut 72 000 fois l’étendue utile en tirant depuis la lampe, 7,5 fois en tirant à rebours depuis le trou : les poids compensent, le flux sur l’écran est le même.</desc>
<rect width="780" height="940" fill="#0f1216"/>
<text x="24" y="32" fill="#c9cfd8" font-size="16" font-weight="600">Tirer un rayon, c’est choisir un point et une direction</text>
<text x="24" y="54" fill="#8a939f">schéma de principe</text>
<line x1="110" y1="130" x2="110" y2="250" stroke="#8a939f" stroke-width="6" stroke-linecap="round"/>
<line x1="470" y1="100" x2="470" y2="280" stroke="#7fb4ff" stroke-width="4" stroke-linecap="round"/>
<text x="110" y="278" fill="#8a939f" text-anchor="middle">source (luminance L)</text>
<text x="470" y="308" fill="#7fb4ff" text-anchor="middle">ouverture visée</text>
<line x1="113" y1="160.1" x2="468" y2="197.6" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="175.2" x2="468" y2="207.8" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="204.3" x2="468" y2="115.7" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="134.5" x2="468" y2="247.7" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="162.6" x2="468" y2="144.6" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="246.5" x2="468" y2="184.9" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="228.4" x2="468" y2="186.0" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="205.9" x2="468" y2="130.3" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="205.4" x2="468" y2="252.9" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="192.6" x2="468" y2="231.3" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="209.5" x2="468" y2="115.4" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="219.4" x2="468" y2="205.6" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="167.3" x2="468" y2="109.8" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="231.7" x2="468" y2="185.3" stroke="#8a939f" stroke-opacity=".45" stroke-width="1.1"/>
<line x1="113" y1="165" x2="468" y2="242" stroke="#e0b84c" stroke-width="2.2"/>
<line x1="101" y1="156" x2="101" y2="174" stroke="#e0b84c" stroke-width="3"/>
<text x="94" y="170" fill="#e0b84c" text-anchor="end">dS₁</text>
<line x1="479" y1="231" x2="479" y2="253" stroke="#e0b84c" stroke-width="3"/>
<text x="486" y="247" fill="#e0b84c">dS₂</text>
<text x="290.0" y="240" fill="#e0b84c">r</text>
<text x="24" y="338" fill="#c9cfd8">Un rayon part d’un point de la source et vise un point de l’ouverture.</text>
<text x="24" y="360" fill="#e0b84c">Le pinceau autour de lui a une étendue dG = dS₁ cos θ₁ · dS₂ cos θ₂ / r²,</text>
<text x="24" y="382" fill="#e0b84c">qui mesure combien de lumière il peut transporter.</text>
<text x="24" y="404" fill="#c9cfd8">Toutes les combinaisons possibles forment un faisceau d’étendue G,</text>
<text x="24" y="426" fill="#c9cfd8">qui transporte le flux L·G (L : luminance de la source).</text>
<text x="24" y="448" fill="#c9cfd8">N rayons tirés au hasard s’en partagent chacun L·G/N :</text>
<text x="24" y="470" fill="#c9cfd8">c’est leur poids.</text>
<text x="24" y="492" fill="#8a939f">Un rayon arrêté en route ne dépose rien ;</text>
<text x="24" y="514" fill="#8a939f">les autres déposent leur poids sur l’écran.</text>
<text x="24" y="560" fill="#c9cfd8" font-size="16" font-weight="600">Deux façons de tirer, un même faisceau utile</text>
<text x="24" y="582" fill="#8a939f">montage de la figure suivante ; étendues comparées à celle du faisceau utile (échelle log)</text>
<line x1="230.0" y1="610" x2="230.0" y2="738" stroke="#8a939f" stroke-opacity=".2"/><text x="230.0" y="756" fill="#8a939f" font-size="13" text-anchor="middle">1</text>
<line x1="316.0" y1="610" x2="316.0" y2="738" stroke="#8a939f" stroke-opacity=".2"/><text x="316.0" y="756" fill="#8a939f" font-size="13" text-anchor="middle">10</text>
<line x1="402.0" y1="610" x2="402.0" y2="738" stroke="#8a939f" stroke-opacity=".2"/><text x="402.0" y="756" fill="#8a939f" font-size="13" text-anchor="middle">100</text>
<line x1="488.0" y1="610" x2="488.0" y2="738" stroke="#8a939f" stroke-opacity=".2"/><text x="488.0" y="756" fill="#8a939f" font-size="13" text-anchor="middle">1 000</text>
<line x1="574.0" y1="610" x2="574.0" y2="738" stroke="#8a939f" stroke-opacity=".2"/><text x="574.0" y="756" fill="#8a939f" font-size="13" text-anchor="middle">10 000</text>
<line x1="660.0" y1="610" x2="660.0" y2="738" stroke="#8a939f" stroke-opacity=".2"/><text x="660.0" y="756" fill="#8a939f" font-size="13" text-anchor="middle">100 000</text>
<text x="24" y="637" fill="#c9cfd8">utile : atteint l’écran</text>
<line x1="230" y1="632" x2="234.0" y2="632" stroke="#e0b84c" stroke-width="14"/>
<text x="250.0" y="637" fill="#e0b84c">× 1</text>
<text x="24" y="677" fill="#c9cfd8">tiré à rebours (trou)</text>
<line x1="230" y1="672" x2="305.3" y2="672" stroke="#7fb4ff" stroke-width="14"/>
<text x="321.3" y="677" fill="#7fb4ff">× 7,5</text>
<text x="24" y="717" fill="#c9cfd8">tiré en direct (lampe)</text>
<line x1="230" y1="712" x2="647.9" y2="712" stroke="#8a939f" stroke-width="14"/>
<text x="663.9" y="717" fill="#8a939f">× 72 000</text>
<text x="330" y="796" fill="#8a939f" font-weight="600">en direct</text><text x="560" y="796" fill="#7fb4ff" font-weight="600">à rebours</text>
<text x="24" y="822" fill="#c9cfd8">part des rayons tirés qui sont utiles</text><text x="330" y="822" fill="#c9cfd8">1 sur 72 000</text><text x="560" y="822" fill="#c9cfd8">13 %</text>
<text x="24" y="846" fill="#c9cfd8">poids d’un rayon</text><text x="330" y="846" fill="#c9cfd8">9 600 fois plus lourd</text><text x="560" y="846" fill="#c9cfd8">référence</text>
<text x="24" y="870" fill="#c9cfd8">flux sur l’écran = utiles × poids</text><text x="330" y="870" fill="#c9cfd8">0,95 ± 0,1</text><text x="560" y="870" fill="#c9cfd8">1</text>
<text x="24" y="912" fill="#8a939f">Le poids compense ce que le tirage gaspille : même flux, seul le bruit change.</text>
</svg>