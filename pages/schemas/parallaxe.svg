<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 874" width="780" height="874" role="img" aria-labelledby="t dd" font-family="system-ui, sans-serif" font-size="14">
<title id="t">Parallaxe entre la fente et le réticule</title>
<desc id="dd">Champ de la lunette du goniomètre, rendu par le moteur, pour trois positions de l’œil. Collimateur déréglé : l’image de la fente, plus loin que le réticule, se décale avec l’œil. Collimateur réglé : fente et réticule restent superposés. En dessous, l’écart apparent selon la position de l’œil : droites de pente proportionnelle à la différence de vergence, nulle quand les deux sont dans le même plan.</desc>
<rect width="780" height="874" fill="#0f1216"/>
<text x="24" y="32" fill="#c9cfd8" font-size="16" font-weight="600">Ce qui bouge quand l’œil bouge</text>
<text x="24" y="54" fill="#8a939f">champ de la lunette rendu par le moteur : fente au sodium, réticule éclairé, œil accommodé sur le réticule</text>
<text x="250" y="92" fill="#8a939f" text-anchor="middle">œil 1,2 mm à gauche</text>
<text x="430" y="92" fill="#8a939f" text-anchor="middle">œil au centre</text>
<text x="610" y="92" fill="#8a939f" text-anchor="middle">œil 1,2 mm à droite</text>
<text x="24" y="167.0" fill="#c9cfd8" font-weight="600">collimateur déréglé</text>
<text x="24" y="189.0" fill="#8a939f" font-size="13">la fente, plus loin</text>
<text x="24" y="208.0" fill="#8a939f" font-size="13">que le réticule,</text>
<text x="24" y="227.0" fill="#8a939f" font-size="13">suit l’œil</text>
<image x="175.0" y="106" width="150" height="150" href="data:image/png;base64,"/>
<rect x="175.0" y="106" width="150" height="150" fill="none" stroke="#8a939f" stroke-opacity=".5"/>
<text x="250" y="275" fill="#e0b84c" font-size="13" text-anchor="middle">écart −5,3′</text>
<image x="355.0" y="106" width="150" height="150" href="data:image/png;base64,"/>
<rect x="355.0" y="106" width="150" height="150" fill="none" stroke="#8a939f" stroke-opacity=".5"/>
<text x="430" y="275" fill="#8a939f" font-size="13" text-anchor="middle">écart 0′</text>
<image x="535.0" y="106" width="150" height="150" href="data:image/png;base64,"/>
<rect x="535.0" y="106" width="150" height="150" fill="none" stroke="#8a939f" stroke-opacity=".5"/>
<text x="610" y="275" fill="#e0b84c" font-size="13" text-anchor="middle">écart 5,3′</text>
<text x="24" y="361.0" fill="#c9cfd8" font-weight="600">collimateur réglé</text>
<text x="24" y="383.0" fill="#8a939f" font-size="13">fente et réticule</text>
<text x="24" y="402.0" fill="#8a939f" font-size="13">dans le même plan :</text>
<text x="24" y="421.0" fill="#8a939f" font-size="13">rien ne bouge</text>
<image x="175.0" y="300" width="150" height="150" href="data:image/png;base64,"/>
<rect x="175.0" y="300" width="150" height="150" fill="none" stroke="#8a939f" stroke-opacity=".5"/>
<text x="250" y="469" fill="#8a939f" font-size="13" text-anchor="middle">écart 0′</text>
<image x="355.0" y="300" width="150" height="150" href="data:image/png;base64,"/>
<rect x="355.0" y="300" width="150" height="150" fill="none" stroke="#8a939f" stroke-opacity=".5"/>
<text x="430" y="469" fill="#8a939f" font-size="13" text-anchor="middle">écart 0′</text>
<image x="535.0" y="300" width="150" height="150" href="data:image/png;base64,"/>
<rect x="535.0" y="300" width="150" height="150" fill="none" stroke="#8a939f" stroke-opacity=".5"/>
<text x="610" y="469" fill="#8a939f" font-size="13" text-anchor="middle">écart 0′</text>
<text x="24" y="512" fill="#c9cfd8" font-size="16" font-weight="600">L’écart grandit avec le décalage de l’œil</text>
<text x="24" y="534" fill="#8a939f">écart apparent entre la fente et le réticule, selon la position de l’œil</text>
<line x1="96" y1="762.0" x2="560" y2="762.0" stroke="#8a939f" stroke-opacity="0.2"/><text x="88" y="767.0" fill="#8a939f" font-size="13" text-anchor="end">−8′</text>
