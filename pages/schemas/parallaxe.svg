<line x1="96.0" y1="762" x2="96.0" y2="767" stroke="#8a939f"/><text x="96.0" y="783" fill="#8a939f" font-size="13" text-anchor="middle">−1,5</text>
<line x1="173.3" y1="762" x2="173.3" y2="767" stroke="#8a939f"/><text x="173.3" y="783" fill="#8a939f" font-size="13" text-anchor="middle">−1</text>
<line x1="250.7" y1="762" x2="250.7" y2="767" stroke="#8a939f"/><text x="250.7" y="783" fill="#8a939f" font-size="13" text-anchor="middle">−0,5</text>
<line x1="328.0" y1="762" x2="328.0" y2="767" stroke="#8a939f"/><text x="328.0" y="783" fill="#8a939f" font-size="13" text-anchor="middle">0</text>
<line x1="405.3" y1="762" x2="405.3" y2="767" stroke="#8a939f"/><text x="405.3" y="783" fill="#8a939f" font-size="13" text-anchor="middle">0,5</text>
<line x1="482.7" y1="762" x2="482.7" y2="767" stroke="#8a939f"/><text x="482.7" y="783" fill="#8a939f" font-size="13" text-anchor="middle">1</text>
<line x1="560.0" y1="762" x2="560.0" y2="767" stroke="#8a939f"/><text x="560.0" y="783" fill="#8a939f" font-size="13" text-anchor="middle">1,5</text>
<text x="328.0" y="804" fill="#8a939f" text-anchor="middle">position de l’œil dans le cercle oculaire (mm)</text>
