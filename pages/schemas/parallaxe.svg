<text x="574" y="742.3" fill="#7fb4ff" font-size="13">fente plus près :</text>
<text x="574" y="759.3" fill="#7fb4ff" font-size="13">elle va contre l’œil</text>
<text x="24" y="838" fill="#c9cfd8">écart = décalage de l’œil × différence de vergence fente − réticule (1,6 δ pour 1 mm de tirage) ;</text>
