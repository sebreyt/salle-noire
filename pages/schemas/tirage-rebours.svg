<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14">
<title id="t">Tirage des rayons : depuis la lampe, ou depuis le trou à rebours</title>
<desc id="d">Le même montage (lanterne éclairant un trou de 0,1 mm au foyer d'une lentille de 200 mm, seconde lentille,
écran), vue de dessus, échelle verticale élargie ×7. Rayons et comptages tirés du moteur du banc, graine 1, 20 000 tirages.
En haut, tirage direct depuis la lampe : 1 rayon sur 20 000 passe le trou et atteint l'écran.
En bas, tirage à rebours depuis le trou : 2665 rayons sur 20 000 (13,3 %) atteignent l'écran ;
les autres ratent le filament en remontant (pointillés, croix) et sont perdus. Le poids de chaque rayon corrige son tirage :
l'éclairement estimé est le même, seule la part des rayons utiles change.</desc>
<rect width="800" height="940" fill="#0f1216"/>
